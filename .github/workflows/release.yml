name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go mod download
      - run: make release VERSION="${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" dist/netkit_linux_amd64.tar.gz dist/netkit_linux_arm64.tar.gz dist/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
